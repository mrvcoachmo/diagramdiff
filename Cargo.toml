[package]
name = "diagramdiff"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Shows what changed between two Excalidraw files, in the diagram's own terms"
license = "MIT"
repository = "https://github.com/mrvcoachmo/diagramdiff"
keywords = ["diff", "diagram", "excalidraw"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# From BeautifulRust lints/lints.toml (v1.4.0), with only the settings that change something here.
# Its library lints are left out: diagramdiff is a CLI and prints by design.
[lints.rust]
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic_in_result_fn = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
string_add = "warn"
as_conversions = "warn"
dbg_macro = "warn"
todo = "warn"
