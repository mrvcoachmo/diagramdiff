[package]
name = "diagramdiff"
version = "0.0.1"
edition = "2024"
description = "Shows what changed between two diagram files, in the diagram's own terms"
license = "MIT"
repository = "https://github.com/mrvcoachmo/diagramdiff"
keywords = ["diff", "diagram", "excalidraw", "drawio", "mermaid"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
